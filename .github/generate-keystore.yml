name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      password:
        description: "كلمة سر المفتاح (6 أحرف أو أكثر)"
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate 100-year keystore
        env:
          PASS: ${{ inputs.password }}
        run: |
          echo "::add-mask::$PASS"
          keytool -genkeypair -v \
            -keystore stube-release.jks \
            -alias stube \
            -keyalg RSA -keysize 2048 \
            -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Stube, OU=Stube, O=Stube, L=Riyadh, ST=Riyadh, C=SA"
          base64 -w0 stube-release.jks > keystore-base64.txt

      - name: Upload keystore (artifact, 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: stube-keystore
          path: |
            stube-release.jks
            keystore-base64.txt
          retention-days: 1
